# =============================================================================
# MasterDns2Udp — Server Configuration
# =============================================================================
# This process runs on the ABROAD side (free internet — e.g. AWS, VPS outside Iran).
# Clients in Iran upload traffic as DNS queries directed here; the server pushes
# downloads back to the Iran-side client over a separate channel.
#
# QUICK START
#   1. Point the NS record of your tunnel subdomain to this server's public IP.
#   2. Set DOMAIN below to match that subdomain.
#   3. Generate a shared key:  openssl rand -base64 32 > encrypt_key.txt
#      (copy the same key to every client)
#   4. Pick a download channel (see section below).
#   5. Open the required ports in your firewall and start the process.
# =============================================================================

# ── Bind Address ──────────────────────────────────────────────────────────────

# Interface to listen on for DNS upload traffic. 0.0.0.0 = all interfaces.
UDP_HOST = "0.0.0.0"

# Port for the DNS upload channel — clients send tunnel queries here.
# 53 is standard. If running alongside a local resolver, use another port.
UDP_PORT = 53

# ── Download Channel ──────────────────────────────────────────────────────────
#
# The server sends encrypted packets as plain UDP datagrams to each client's
# public IP. Set the port and open it in the firewall.
#    ► Set UDP_DOWNLOAD_PORT to a non-zero port (e.g. 5555).
#      Client must set UDP_DOWNLOAD_IP + UDP_DOWNLOAD_PORT to match.
#      Open this port in your firewall (ufw allow 5555/udp).

# UDP download port. 0 = disabled (not recommended).
UDP_DOWNLOAD_PORT = 5555

# ── SOCKS5 Upload Path (optional) ─────────────────────────────────────────────
#
# Clients can mirror every upload packet through local SOCKS5 proxies as
# an additional upload path alongside DNS. Enable this port to receive those
# packets. Must also open in firewall (ufw allow 5556/udp).
# Counterpart on the client: UDP_UPLOAD_PORT + UPLOAD_SOCKS5_PROXIES.

# UDP port for direct client→server upload packets via SOCKS5 paths. 0 = disabled.
UDP_UPLOAD_PORT = 0

# ── DNS Domain ────────────────────────────────────────────────────────────────

# The subdomain(s) this server claims as tunnel traffic.
# Must match DOMAINS on every client. Set the NS record for this subdomain
# to point to this server so resolvers forward queries here.
DOMAIN = ["tunnel.example.com"]

# Minimum label length to treat a DNS query as tunnel traffic (not public DNS).
# Default 3 is fine for virtually all use cases.
MIN_VPN_LABEL_LENGTH = 3

# ── Encryption ────────────────────────────────────────────────────────────────

# Encryption algorithm. 1 = ChaCha20-Poly1305 (recommended, no alternative).
DATA_ENCRYPTION_METHOD = 1

# Path to the shared secret key file. Generate once with:
#   openssl rand -base64 32 > encrypt_key.txt
# The client must use the exact same value in its ENCRYPTION_KEY field.
ENCRYPTION_KEY_FILE = "encrypt_key.txt"

# ── Upstream DNS ──────────────────────────────────────────────────────────────
#
# When the server receives a DNS query that is NOT tunnel traffic (normal
# public DNS), it forwards the query to these resolvers and returns the real
# answer, so the server can act as a transparent DNS proxy on port 53.

DNS_UPSTREAM_SERVERS = ["8.8.8.8:53", "1.1.1.1:53"]
DNS_UPSTREAM_TIMEOUT = 4.0   # seconds before the upstream query is abandoned

# ── Forwarding Protocol ───────────────────────────────────────────────────────

# What the server proxies on behalf of clients.
# "SOCKS5" = built-in SOCKS5 server, no external software required.
PROTOCOL_TYPE = "SOCKS5"

# Require username / password on the built-in SOCKS5 proxy.
SOCKS5_AUTH = false
SOCKS5_USER = "admin"
SOCKS5_PASS = "changeme"

# Use an already-running external SOCKS5 proxy instead of the built-in one.
USE_EXTERNAL_SOCKS5 = false

# ── Performance ───────────────────────────────────────────────────────────────

# Parallel UDP reader goroutines. 0 = auto (scales with CPU count).
UDP_READERS = 4

# DNS request worker goroutines.
DNS_REQUEST_WORKERS = 8

# ── Compression ───────────────────────────────────────────────────────────────

# Compression algorithms the server is willing to use.
# Clients negotiate the actual type; the server accepts any listed here.
# 0=off  1=ZSTD  2=LZ4  3=ZLIB
SUPPORTED_UPLOAD_COMPRESSION_TYPES   = [0, 1, 2, 3]
SUPPORTED_DOWNLOAD_COMPRESSION_TYPES = [0, 1, 2, 3]

# ── Session & Reliability (ARQ) ───────────────────────────────────────────────

# How long an idle session is kept before being evicted.
SESSION_TIMEOUT_SECONDS = 300.0

# ARQ sliding-window size (packets in flight before the sender must wait for ACK).
ARQ_WINDOW_SIZE = 800

# Retransmission timeout: initial value and maximum back-off ceiling.
ARQ_INITIAL_RTO_SECONDS = 1.0
ARQ_MAX_RTO_SECONDS     = 5.0

# ── Logging ───────────────────────────────────────────────────────────────────

# DEBUG, INFO, WARN, ERROR — use INFO in production, DEBUG for diagnostics.
LOG_LEVEL = "INFO"
